<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Rounded Card -->
  <rect x="40" y="40" width="432" height="432" rx="80" ry="80" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <rect x="40" y="40" width="432" height="432" rx="80" ry="80" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Top Banner -->
  <path d="M 40 120 C 40 76, 76 40, 120 40 L 392 40 C 436 40, 472 76, 472 120 L 472 160 L 40 160 Z" fill="url(#headerGrad)"/>

  <!-- Binder Rings -->
  <rect x="140" y="20" width="28" height="56" rx="14" fill="#94a3b8"/>
  <rect x="344" y="20" width="28" height="56" rx="14" fill="#94a3b8"/>

  <!-- Persian Number or Icon Graphic -->
  <!-- Clock Arc -->
  <circle cx="256" cy="310" r="110" fill="none" stroke="rgba(59, 130, 246, 0.25)" stroke-width="16"/>
  <circle cx="256" cy="310" r="110" fill="none" stroke="#10b981" stroke-width="16" stroke-dasharray="691" stroke-dashoffset="240" stroke-linecap="round"/>

  <!-- Clock Hands -->
  <line x1="256" y1="310" x2="256" y2="240" stroke="#f8fafc" stroke-width="12" stroke-linecap="round"/>
  <line x1="256" y1="310" x2="310" y2="310" stroke="#f8fafc" stroke-width="10" stroke-linecap="round"/>
  <circle cx="256" cy="310" r="12" fill="#3b82f6"/>

  <!-- Small Calendar Grid Accents -->
  <circle cx="120" cy="220" r="10" fill="#3b82f6"/>
  <circle cx="160" cy="220" r="10" fill="rgba(255,255,255,0.2)"/>
  <circle cx="200" cy="220" r="10" fill="rgba(255,255,255,0.2)"/>
  <circle cx="120" cy="260" r="10" fill="rgba(255,255,255,0.2)"/>
  <circle cx="160" cy="260" r="10" fill="#ef4444"/>
</svg>
